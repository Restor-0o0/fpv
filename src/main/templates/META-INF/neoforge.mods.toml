modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="fpv_logo.png"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# JEI is an optional client integration. Declaring it lets NeoForge order and
# expose the JEI plugin scan alongside the mod when JEI is installed.
[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19.0,)"
ordering="AFTER"
side="CLIENT"
